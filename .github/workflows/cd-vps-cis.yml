# core-deploy reusable CD workflow para vps-cis (108.175.4.190)
#
# Uso desde repo consumidor:
#   .github/workflows/deploy.yml:
#     name: Deploy
#     on:
#       push:
#         branches: [main]
#     jobs:
#       deploy:
#         uses: innovacionsantiago/core-deploy/.github/workflows/cd-vps-cis.yml@main
#         with:
#           target_path: /srv/projects/cds/cis/cis-mailer
#           service_name: cis-mailer
#         secrets: inherit
#
# Org secrets requeridos:
#   CIS_VPS_HOST = 108.175.4.190
#   CIS_VPS_USER = illanes00
#   CIS_VPS_SSH_KEY = ed25519 private key
#
# NOTA seguridad: workflow NO usa contexto untrusted en run blocks.

name: cd-vps-cis (reusable)

on:
  workflow_call:
    inputs:
      target_path:
        description: "Path absoluto en vps-cis (debe empezar con /srv/)"
        required: true
        type: string
      service_name:
        description: "systemd unit name (sin .service)"
        required: true
        type: string
      post_deploy_script:
        description: "Script post-deploy relativo a target_path"
        required: false
        type: string
        default: "deploy/post_deploy.sh"
      health_url:
        description: "URL health check (curl desde el host)"
        required: false
        type: string
        default: "http://127.0.0.1/healthz"
      rsync_excludes:
        description: "Patrones extra rsync --exclude (separados por espacio)"
        required: false
        type: string
        default: ""
      notify_on_failure:
        description: "Notificar via Resend al fallar"
        required: false
        type: boolean
        default: false
      working_directory:
        description: "Subdirectory del repo a sincronizar"
        required: false
        type: string
        default: "."
      untracked_audit_strict:
        description: "V2 audit pre-flight: si HIGH severity (source/migration/workflow) untracked → abort. CRITICAL (secretos) siempre aborta."
        required: false
        type: boolean
        default: true
      untracked_audit_bypass:
        description: "Escape hatch: forzar deploy aunque audit detecte HIGH. Solo para rollback emergencia."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: rsync+postdeploy+healthz
    runs-on: ubuntu-latest
    concurrency:
      group: cd-vps-cis-${{ inputs.service_name }}
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.CIS_VPS_HOST }}
      VPS_USER: ${{ secrets.CIS_VPS_USER }}
      TARGET_PATH: ${{ inputs.target_path }}
      SERVICE_NAME: ${{ inputs.service_name }}
      POST_DEPLOY_SCRIPT: ${{ inputs.post_deploy_script }}
      HEALTH_URL: ${{ inputs.health_url }}
      EXTRA_EXCLUDES: ${{ inputs.rsync_excludes }}
      WORKDIR: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate inputs and secrets
        env:
          SSH_KEY_PRESENT: ${{ secrets.CIS_VPS_SSH_KEY != '' }}
        shell: bash
        run: |
          missing=0
          [ -z "$VPS_HOST" ] && { echo "::error::CIS_VPS_HOST org secret missing"; missing=1; }
          [ -z "$VPS_USER" ] && { echo "::error::CIS_VPS_USER org secret missing"; missing=1; }
          [ "$SSH_KEY_PRESENT" != "true" ] && { echo "::error::CIS_VPS_SSH_KEY org secret missing"; missing=1; }
          [ -z "$TARGET_PATH" ] && { echo "::error::target_path required"; missing=1; }
          [ -z "$SERVICE_NAME" ] && { echo "::error::service_name required"; missing=1; }
          case "$TARGET_PATH" in
            /srv/*) ;;
            *) echo "::error::target_path must start with /srv/ (got: $TARGET_PATH)"; missing=1 ;;
          esac
          [ "$missing" = "1" ] && exit 1
          echo "::notice::Deploy $SERVICE_NAME to $VPS_USER@$VPS_HOST:$TARGET_PATH"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.CIS_VPS_SSH_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host vps-cis"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USER"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes vps-cis 'echo SSH_OK && hostname && id -un' || {
            echo "::error::SSH connectivity failed"
            exit 1
          }

      - name: Ensure target_path on remote
        shell: bash
        run: ssh vps-cis "mkdir -p '$TARGET_PATH'"

      - name: Pre-flight · audit untracked-on-prod (V2 strict)
        # W11.5 · W12 cis-inbox incident: rsync --delete borró 25 archivos
        # huérfanos (services/authorization.py, models/audience_audit.py,
        # alembic/versions/k0m2o4q6s8u0_*.py, etc.) cuando el repo en GitHub
        # estaba desincronizado · service down 4 min hasta rescue desde JSONL.
        #
        # V2 (post-W12.6): clasifica untracked por severidad.
        #   - CRITICAL (.env*, *.pem, *.key, *.pfx) → siempre abort.
        #   - HIGH (.py, .ts, .tsx, .sql en alembic/versions/, .yml en .github/) →
        #     abort si untracked_audit_strict=true (default), unless bypass.
        #   - MEDIUM/LOW → warn-only.
        # Bypass: untracked_audit_bypass=true (solo rollback emergencia).
        # Ver: cis-validators structure.untracked_on_prod + ROLLBACK.md
        shell: bash
        env:
          STRICT: ${{ inputs.untracked_audit_strict }}
          BYPASS: ${{ inputs.untracked_audit_bypass }}
        run: |
          ssh vps-cis "
            set -e
            cd '$TARGET_PATH' 2>/dev/null || { echo '::notice::target_path no existe aún (primer deploy)'; exit 0; }
            if [ ! -d .git ]; then
              echo '::notice::no es git repo en prod, skip pre-flight'
              exit 0
            fi
            UNTRACKED=\$(git ls-files --others --exclude-standard 2>/dev/null || true)
            if [ -z \"\$UNTRACKED\" ]; then
              echo \"::notice::[$SERVICE_NAME] prod git ls-files --others limpio\"
              exit 0
            fi
            CRIT=0; HIGH=0; OTHER=0
            CRIT_LIST=''; HIGH_LIST=''; OTHER_LIST=''
            while IFS= read -r f; do
              [ -z \"\$f\" ] && continue
              case \"\$f\" in
                *.env|*.env.*|*.pem|*.key|*.pfx|*.p12|*credentials*.json|*service-account*.json)
                  CRIT=\$((CRIT+1)); CRIT_LIST=\"\$CRIT_LIST\$f\n\" ;;
                alembic/versions/*.py|*/alembic/versions/*.py|.github/workflows/*.yml|.github/workflows/*.yaml)
                  HIGH=\$((HIGH+1)); HIGH_LIST=\"\$HIGH_LIST\$f\n\" ;;
                *.py|*.ts|*.tsx|*.js|*.jsx|*.vue|*.go|*.rs|*.rb|*.sql)
                  case \"\$f\" in
                    tests/*|*/tests/*|*_test.*|test_*) OTHER=\$((OTHER+1)); OTHER_LIST=\"\$OTHER_LIST\$f\n\" ;;
                    *) HIGH=\$((HIGH+1)); HIGH_LIST=\"\$HIGH_LIST\$f\n\" ;;
                  esac ;;
                *)
                  OTHER=\$((OTHER+1)); OTHER_LIST=\"\$OTHER_LIST\$f\n\" ;;
              esac
            done <<<\"\$UNTRACKED\"
            TOTAL=\$((CRIT+HIGH+OTHER))
            echo \"::notice::[$SERVICE_NAME] untracked: total=\$TOTAL critical=\$CRIT high=\$HIGH other=\$OTHER\"
            if [ \"\$CRIT\" -gt 0 ]; then
              echo \"::error::[$SERVICE_NAME] \$CRIT secret(s) untracked detectados (CRITICAL · siempre abort)\"
              printf \"\$CRIT_LIST\" | sed 's/^/::error::  /'
              exit 2
            fi
            if [ \"\$HIGH\" -gt 0 ]; then
              echo \"::warning::[$SERVICE_NAME] \$HIGH source/migration/workflow file(s) untracked (HIGH · serán BORRADOS por rsync --delete):\"
              printf \"\$HIGH_LIST\" | head -30 | sed 's/^/::warning::  /'
              if [ \"\$BYPASS\" = \"true\" ]; then
                echo \"::warning::untracked_audit_bypass=true · continuando bajo responsabilidad del caller\"
              elif [ \"\$STRICT\" = \"true\" ]; then
                echo \"::error::HIGH-severity untracked detectado · abortando deploy. Commit (o gitignore) primero. Para forzar: untracked_audit_bypass=true (rollback emergencia)\"
                exit 1
              else
                echo \"::warning::untracked_audit_strict=false · continuando como warn-only\"
              fi
            fi
            if [ \"\$OTHER\" -gt 0 ]; then
              echo \"::warning::[$SERVICE_NAME] \$OTHER otro(s) untracked (test/data/docs · LOW/MEDIUM, sin abort)\"
              printf \"\$OTHER_LIST\" | head -10 | sed 's/^/::warning::  /'
            fi
          "

      - name: Rsync repo to vps-cis
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          excludes=(
            --exclude='.git'
            --exclude='.github'
            --exclude='.venv'
            --exclude='venv'
            --exclude='__pycache__'
            --exclude='*.pyc'
            --exclude='.pytest_cache'
            --exclude='.mypy_cache'
            --exclude='.ruff_cache'
            --exclude='node_modules'
            --exclude='.next'
            --exclude='coverage'
            --exclude='.coverage'
            --exclude='dist'
            --exclude='build'
            --exclude='.env'
            --exclude='.env.local'
            --exclude='*.log'
          )
          if [ -n "$EXTRA_EXCLUDES" ]; then
            for pat in $EXTRA_EXCLUDES; do
              excludes+=(--exclude="$pat")
            done
          fi
          rsync -az --delete "${excludes[@]}" \
            -e "ssh -o BatchMode=yes" \
            ./ "vps-cis:$TARGET_PATH/"

      - name: Run post-deploy script
        shell: bash
        run: |
          ssh vps-cis "set -e; cd '$TARGET_PATH' && \
            if [ -f '$POST_DEPLOY_SCRIPT' ]; then \
              export SERVICE_NAME='$SERVICE_NAME' HEALTH_URL='$HEALTH_URL'; \
              bash '$POST_DEPLOY_SCRIPT'; \
            else \
              echo 'WARNING: $POST_DEPLOY_SCRIPT not found in target, skipping'; \
            fi"

      - name: Health check (remote curl)
        shell: bash
        run: |
          ssh vps-cis "curl -fsS --max-time 10 --retry 3 --retry-delay 2 '$HEALTH_URL'" || {
            echo "::error::Health check failed at $HEALTH_URL"
            exit 1
          }
          echo "::notice::Health check OK"

      - name: Notify on failure
        if: failure() && inputs.notify_on_failure
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY_CIS }}
          SVC: ${{ inputs.service_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$RESEND_KEY" ]; then
            echo "::warning::RESEND_API_KEY_CIS missing, cannot notify"
            exit 0
          fi
          payload=$(python3 -c "
          import json, os
          print(json.dumps({
              'from': 'deploy@innovacionsantiago.cl',
              'to': ['hola@innovacionsantiago.cl'],
              'subject': f'[deploy-fail] {os.environ[\"SVC\"]} - {os.environ[\"REPO\"]}',
              'text': f'Deploy {os.environ[\"SVC\"]} from {os.environ[\"REPO\"]} run {os.environ[\"RUN_ID\"]} FAILED.',
          }))")
          curl -fsS -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_KEY" \
            -H 'Content-Type: application/json' \
            -d "$payload" || echo "::warning::Resend notification failed"

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
